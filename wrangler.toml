name = "v20251104"
main = "_worker.js"
compatibility_date = "2025-11-04"
keep_vars = true

[observability]
enabled = true

# 显式放置提示：把 Worker 钉在美西机房，出口即美国。这是大陆免 WARP 稳定访问
# Claude/Gemini 的地基（详见 cc-gemini-v2r-one/netfix/标准部署.md）。
# 之前只在 Cloudflare 面板设过（易被重新部署冲掉），写进这里才持久。
# 注意：本 Worker 线上名为 dfvpn，部署务必指向该名（如 wrangler deploy --name dfvpn）。
[placement]
region = "gcp:us-west1"

